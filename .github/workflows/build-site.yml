name: Build site

on:
  push:
  pull_request:
  schedule:
    - cron: '0 * * * *'  # Automatically fetches your latest status in the background every single hour
  workflow_dispatch:      # Adds a button on GitHub to manually sync with 1 click

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      # STEP 1: Downloads your live data cleanly straight into your main root folder
      - name: Fetch Live Data from Status Cafe
        run: |
          curl -s "https://status.cafe/users/aezi/status.json" -o "status.json"

      # STEP 2: Primary Neocities deployment sync (Now targets your root directory)
      - if: ${{ success() && github.ref == 'refs/heads/main' }}
        id: deploy
        continue-on-error: true
        uses: bcomnes/deploy-to-neocities@v1
        with:
          api_token: ${{ secrets.NEOCITIES_API_KEY }}
          dist_dir: .
          cleanup: false

      # STEP 3: Fallback deployment engine targeting the root directory in case the primary fails
      - name: Deploy to Neocities fallback
        if: ${{ steps.deploy.outcome == 'failure' && github.ref == 'refs/heads/main' }}
        uses: jonchang/deploy-neocities@master
        with:
          key: ${{ secrets.NEOCITIES_API_KEY }}
          dir: .
          clean: false
