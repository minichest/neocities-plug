<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Hill Guestbook</title>
    <!-- Bulma Core Framework Layer -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link href="/res/css/green-hill-zone.css" rel="stylesheet" type="text/css" media="all">
  </head>
  <body class="guestbook-page-body">

    <!-- FIXED: Wrapped in a fluid container to keep absolute layout safe or snap inline on small screens -->
    <div class="top-nav-box px-4 pt-4">
      <a href="javascript:history.back()" class="button style-retro-btn">← Return Back</a>
    </div>

    <!-- FIXED: Added responsive padding classes (px-3-mobile) to guarantee no edge-clipping -->
    <main class="section py-6 px-3-mobile" id="content-box">
      <div class="container is-max-desktop" id="guestbook">
        
        <section class="hero mb-4">
          <!-- FIXED: Removed rigid hero-body padding to lift titles up and keep alignment uniform -->
          <div class="has-text-left-tablet has-text-centered-mobile" id="green-hill-header">
            <!-- FIXED: Dynamic fluid header sizes scale automatically depending on screen width -->
            <h1 class="title is-2-desktop is-3-tablet is-4-mobile mb-2 text-retro-glow">🏁 Green Hill Guestbook</h1>
            <p class="subtitle is-5-desktop is-6-touch has-text-success-dark font-game">
              You've reached the checkpoint! Drop a ring and sign the board before you jet.
            </p>
          </div>
        </section>

        <!-- THE MAIN CONSOLE: Built with a retro checkerboard loop pattern header -->
        <div class="card guestbook-terminal">
          
          <!-- Decorative Checkered Header Bar -->
          <div class="terminal-header-pattern"></div>

          <!-- Seamless Atabook Iframe Window Box -->
          <!-- FIXED: Added fluid responsive style blocks in your CSS to handle internal sizing -->
          <div class="atabook-frame-wrap">
            <iframe 
                src="https://rifabutin.atabook.org/" 
                style="width: 100%; height: 100%; border: none; background: #ffffff;"
                scrolling="yes" 
                allowtransparency="true">
            </iframe>
          </div>

        </div>

      </div>
    </main>

  </body>
</html>
