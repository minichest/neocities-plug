<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Hill Guestbook</title>
    <link rel="stylesheet" href="https://jsdelivr.net">
    <link href="/res/css/green-hill-zone.css" rel="stylesheet" type="text/css" media="all">
  </head>
  <body class="guestbook-page-body">

    <div class="guestbook-main-container">
      
      <div class="guestbook-header-section">
        <h1 class="main-page-title">🏁 Green Hill Guestbook</h1>
        <p class="subtitle-text">
          You've reached the end of the zone! Drop a ring and leave a message before you go.
        </p>
      </div>

      <div class="guestbook-columns-grid">
        
        <div class="guestbook-column-card">
          <h3 class="section-column-title">🪙 Drop a Ring</h3>
          <div class="iframe-wrap" id="cbox-form-wrap">
            <iframe src="https://my.cbox.ws/aezi?sec=form" width="100%" height="500" frameborder="0" allowtransparency="yes" scrolling="no"></iframe>
          </div>
        </div>

        <div class="guestbook-column-card">
          <h3 class="section-column-title">💎 Chaos Emeralds</h3>
          <div class="iframe-wrap" id="cbox-messages-wrap">
            <iframe src="https://my.cbox.ws/aezi?sec=main" width="100%" height="500" frameborder="0" allowtransparency="yes" scrolling="no"></iframe>
          </div>
        </div>

      </div>

      <div class="guestbook-footer-section">
        <a href="/" class="back-home-link">← Return Home</a>
      </div>

    </div>

  </body>
</html>
